[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbackup"
version = "1.0.1-beta"
description = "Geather Ghost relevant data and store it as single Package into OS"
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies
dependencies = [
    "pathlib>=1.0.1",
    "pyjwt>=2.13.0",
    "oci>=2.185.0",
    "requests>=2.34.0",
    "pymysql>=1.2.0",
]

[project.urls]
Homepage = "https://chris.ke"
Repository = "https://github.com/K-OSt8/ghostbackup"

# setuptools package configuration
[tool.setuptools.packages.find]
where = ["src"]

